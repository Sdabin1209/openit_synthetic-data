[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data"
version = "0.2.0"
# 왜 3.11: 시험이 표준 라이브러리 tomllib(3.11+)로 pyproject 를 읽는다. 실제로 쓰는 이미지(Dockerfile PYTHON_IMAGE)와 개발 .venv 는 3.12 이고 3.10 에서 돌린 적이 없다(ADR 0026)
requires-python = ">=3.11"
description = "문진 시스템 합성 데이터 영역: LoRA-A/B 학습 데이터 게시기·시드 잡과 DatasetStore(I2) 서버"
dependencies = [
  "boundary-contracts",
  "openit-link",
  "jsonschema==4.26.0",
  "waitress==3.0.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["synthetic_data", "synthetic_data.components", "synthetic_data.service", "synthetic_data.types", "synthetic_data.wiring"]

[tool.pytest.ini_options]
markers = ["reference_data: 외부 실제 데이터(SD_REFERENCE_DATA_DIR)가 있어야 도는 선택 시험. 선언한 전체 시험 명령은 명시적으로 뺀다"]
testpaths = ["tests"]
pythonpath = ["tests", "."]
