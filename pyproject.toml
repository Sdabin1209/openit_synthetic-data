[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data"
version = "0.2.0"
requires-python = ">=3.10"
description = "문진 시스템 합성 데이터 영역: LoRA-A/B 학습 데이터 게시기·시드 잡과 DatasetStore(I2) 서버"
dependencies = [
  "boundary-contracts",
  "jsonschema==4.10.3",
  "waitress==3.0.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["synthetic_data", "synthetic_data.store", "synthetic_data.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
